aid: gencove
name: Gencove
description: >-
  Gencove is an enterprise analytics platform for low-pass whole genome sequencing
  (lpWGS). Its REST API lets customers upload FASTQ and array data, run samples
  through configurable analysis pipelines, track sample status, download deliverables
  (including merged VCFs, imputation and ancestry outputs), manage projects, batches,
  BaseSpace and S3 imports, and operate the Gencove Explorer compute environment.
  The platform is used across human health, agriculture and research to turn raw
  sequencing reads into genotypes, polygenic scores and ancestry at industrial scale.
  Access is via a web dashboard, the official `gencove` Python CLI/SDK, and a
  versioned HTTP API authenticated with an API key or JWT, with signed webhooks for
  analysis-completion events.
