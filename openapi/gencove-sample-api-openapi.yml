    ReportTypeEnum:
      enum:
      - prs
      type: string
      description: '* `prs` - prs'
    UploadNestedList:
      type: object
      description: Used in sample sheet creation.
      properties:
        upload:
          type: string
          format: uuid
        destination_path:
          type: string
          description: Destination path given by the user as an optional argument
          maxLength: 1024
        last_status:
          allOf:
          - $ref: '#/components/schemas/UploadStatusNested'
          readOnly: true
        source_url:
          type: string
          readOnly: true
      required:
      - last_status
      - source_url
      - upload
    PaginatedSampleStatusListList:
      type: object
      required:
      - results
      properties:
        meta:
          type: object
          properties:
            count:
              type: integer
            next:
              type: string
              format: uri
              nullable: true
            previous:
              type: string
              format: uri
              nullable: true
          required:
          - count
        results:
          type: array
          items:
            $ref: '#/components/schemas/SampleStatusList'
    QualityControl:
      type: object
      properties:
        quality_control_type:
          $ref: '#/components/schemas/QualityControlType'
        quality_control:
          $ref: '#/components/schemas/QualityControlSelfNested'
      required:
      - quality_control
      - quality_control_type
    SampleSheet:
      type: object
      properties:
        client_id:
          type: string
          maxLength: 250
        fastq:
          allOf:
          - $ref: '#/components/schemas/UploadNestedList'
          readOnly: true
          description: Uploaded fastq
      required:
      - client_id
      - fastq
    SampleMetadata:
      type: object
      properties:
        metadata:
          nullable: true
    SampleKitFormCreate:
      type: object
      description: 'Request body for ``POST /api/v2/sample-kit-form/``.


        Mirrors ``ArrayDataUploadFormCreateSerializer`` but is project-scoped: the

        partner names the consumer project the kit''s sample lands in. The end user

        supplies the shipping address later, in the form itself.'
      properties:
        project_id:
          type: string
          format: uuid
          description: UUID of the consumer project to create the kit order in.
        metadata:
          nullable: true
          description: Free-form JSON object stored on the created sample.
        test_mode:
          type: boolean
          default: false
          description: Set to true to create a test order that will not be shipped. Defaults to false.
        redirect_on_success:
          type: string
          format: uri
          default: ''
          description: URL the end-user is redirected to after a successful order.
        redirect_on_failure:
          type: string
          format: uri
          default: ''
          description: URL the end-user is redirected to after a failed order.
        expires_in:
          type: integer
          maximum: 3600
          minimum: 60
          default: 600
          description: JWT lifetime in seconds (default 600, max 3600). Once the URL is opened, a 15-minute session is created that may outlive this token.
      required:
      - project_id
    SampleDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        project:
          type: string
          format: uuid
        run:
          type: string
          format: uuid
          nullable: true
        created:
          type: string
          format: date-time
        modified:
          type: string
          format: date-time
        hidden:
          type: boolean
          description: Flag to hide the sample.
        client_id:
          type: string
          description: 'Legacy: external_id'
          maxLength: 250
        physical_id:
          type: string
          description: 'Legacy: external_id, external_barcode and sample_barcode'
          maxLength: 250
        legacy_id:
          type: string
          description: 'Legacy: sample_id/member_id. Matching sample_ids from back_api app.'
          maxLength: 250
        last_status:
          allOf:
          - $ref: '#/components/schemas/SampleStatusNested'
          readOnly: true
        archive_last_status:
          allOf:
          - $ref: '#/components/schemas/ArchiveSampleStatus'
          readOnly: true
        files:
          type: array
          items:
            $ref: '#/components/schemas/SampleFileNested'
          readOnly: true
          description: Sample files
      required:
      - archive_last_status
      - client_id
      - files
      - id
      - last_status
      - legacy_id
      - modified
      - physical_id
      - project
    TraitScoreSelfNested:
      type: object
      description: Serializer used to nest trait score data within other trait score serializer.
      properties:
        value:
          type: number
          format: double
        percentile:
          type: number
          format: double
          nullable: true
      required:
      - value
    SampleConsumerReportCreate:
      type: object
      properties:
        report_type:
          allOf:
          - $ref: '#/components/schemas/ReportTypeEnum'
          default: prs
          description: 'Type of report to generate


            * `prs` - prs'
        expires_in:
          type: integer
          maximum: 3600
          minimum: 60
          default: 600
          description: Token expiration time in seconds. Note that this value is for the JWT delivered in the URL. Once the URL is accessed, a fixed duration session (15 minutes) is created that may outlive this token
    SampleParentage:
      type: object
      properties:
        parentage_tested:
          type: string
          readOnly: true
        parentage:
          type: string
          readOnly: true
      required:
      - parentage
      - parentage_tested
    GenomicVariant:
      type: object
      description: 'Serializes a `genomic_variants.services.Variant` record.


        `genotype` is an object keyed by the VCF FORMAT field names, e.g.

        `{"GT": "0|0", "DS": "0", "GP": "1,0,0", "RC": "1", "AC": "0", "DP": "1"}`.

        All values are kept as raw strings so the payload mirrors the VCF exactly;

        callers interpret `GT` allele indexes against `alt`.


        `genotype_confidence` is the confidence of the called genotype: the max of

        the `GP` posteriors (the same quantity the VCF''s LOWCONF filter thresholds

        at 0.9), a probability in [0, 1] or null when the record has no `GP` field.'
      properties:
        chromosome:
          type: string
        position:
          type: integer
        rsid:
          type: string
          nullable: true
        ref:
          type: string
        alt:
          type: array
          items:
            type: string
        genotype:
          type: object
          additionalProperties:
            type: string
          nullable: true
        genotype_confidence:
          type: number
          format: double
          nullable: true
        quality:
          type: number
          format: double
          nullable: true
        info:
          type: object
          additionalProperties: {}
      required:
      - alt
      - chromosome
      - genotype
      - genotype_confidence
      - info
      - position
      - quality
      - ref
      - rsid
  securitySchemes:
    API key:
      type: apiKey
      description: 'Authorization header content formated as: `Api-Key <API-key>`

        You can obtain new API key through Gencove''s web UI or `user-api-key` endpoint'
      in: header
      name: Authorization
    JWT:
      type: apiKey
      description: 'Authorization header content formated as: `Bearer <json-web-token>`

        You can obtain access token using `jwt-create` endpoint.'
      in: header
      name: Authorization
