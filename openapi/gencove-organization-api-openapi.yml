openapi: 3.2.0
info:
  title: Gencove Back Organization API
  version: v2
  contact:
    email: support@gencove.com
  license:
    name: Proprietary
  description: 'API for Gencove REST service. Visit enterprise.gencove.com and docs.gencove.com for more information.


    To work with Insomnia, you can generate a Gencove API key by clicking here. Once you have the API key and have imported the project in Insomnia as a Request Collection, enter the key in Insomnia under Manage Environment.

    Run in Insomnia'
servers:
- url: https://api.gencove.com
tags:
- name: Organization
paths:
  /api/v2/organization/:
    get:
      operationId: organization_retrieve
      description: Fetch organization details
      tags:
      - Organization
      security:
      - JWT: []
      - API key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
      summary: Organization retrieve
      x-summary-source: derived
    patch:
      operationId: organization_partial_update
      description: Update organization details
      tags:
      - Organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganization'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrganization'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrganization'
      security:
      - JWT: []
      - API key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
      summary: Organization partial update
      x-summary-source: derived
  /api/v2/organization-monthly-usage-report/:
    get:
      operationId: organization_monthly_usage_report_retrieve
      description: Retrieve CSV monthly usage report. Optionally specify a date range.
      parameters:
      - in: query
        name: from
        schema:
          type: string
        description: Start date for report. Format is YYYY-MM, e.g. 2023-01. Must supply both 'from' and 'to' parameters.
      - in: query
        name: to
        schema:
          type: string
        description: End date for report. Format is YYYY-MM, e.g. 2023-05. Must supply both 'from' and 'to' parameters.
      tags:
      - Organization
      security:
      - JWT: []
      - API key: []
      responses:
        '200':
          description: No response body
      summary: Organization monthly usage report retrieve
      x-summary-source: derived
  /api/v2/organization-roles/{role_id}:
    get:
      operationId: organization_roles_retrieve
      parameters:
      - in: path
        name: role_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Organization
      security:
      - JWT: []
      - API key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoleObject'
          description: ''
      summary: Organization roles retrieve
      x-summary-source: derived
  /api/v2/organization-users/:
    get:
      operationId: organization_users_list
      description: Get organization users.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Search users by name, email or id
      tags:
      - Organization
      security:
      - JWT: []
      - API key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationUserList'
          description: ''
      summary: Organization users list
      x-summary-source: derived
    post:
      operationId: organization_users_create
      tags:
      - Organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleObjectCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRoleObjectCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRoleObjectCreate'
        required: true
      security:
      - JWT: []
      - API key: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoleObject'
          description: ''
      summary: Organization users create
      x-summary-source: derived
  /api/v2/organization-users/{user_id}:
    patch:
      operationId: organization_users_partial_update
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrganizationUser'
      security:
      - JWT: []
      - API key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUser'
          description: ''
      summary: Organization users partial update
      x-summary-source: derived
components:
  schemas:
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 254
        expire_uploads_period_days:
          type:
          - integer
          - 'null'
          readOnly: true
        archive_period_days:
          type:
          - integer
          - 'null'
          readOnly: true
        archive_restore_period_days:
          type:
          - integer
          - 'null'
          readOnly: true
        roles:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/UserRoleObject'
          readOnly: true
          description: Roles in the organization.
        uploads_enabled:
          type: boolean
          readOnly: true
          description: Designates whether the organization can access upload functionality.
        delete_samples_enabled:
          type: boolean
          readOnly: true
          description: Designates whether the organization can delete samples.
        project_sharing_enabled:
          type: boolean
          readOnly: true
          description: When enabled, allows organization to share projects with other organizations.
        account_on_hold:
          type: boolean
          readOnly: true
          description: When enabled, limits ability of organization to manage data and displays UI warning to organization users that invoice is past due.
        organization_type:
          allOf:
          - $ref: '#/components/schemas/OrganizationTypeEnum'
          readOnly: true
          description: 'Type of organization


            * `enterprise` - enterprise

            * `consumer` - consumer

            * `consumer_provider` - consumer provider'
      required:
      - account_on_hold
      - archive_period_days
      - archive_restore_period_days
      - delete_samples_enabled
      - expire_uploads_period_days
      - id
      - name
      - organization_type
      - project_sharing_enabled
      - roles
      - uploads_enabled
    PatchedOrganizationUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect this instead of deleting accounts.
        has_mfa_device:
          type: boolean
          readOnly: true
        name:
          type: string
          maxLength: 254
        roles:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/UserRoleObject'
          readOnly: true
          description: Roles in the organization.
        is_support:
          type: boolean
          readOnly: true
          title: Support
          description: Designates whether this user should be treated as a support.
    OrganizationUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect this instead of deleting accounts.
        has_mfa_device:
          type: boolean
          readOnly: true
        name:
          type: string
          maxLength: 254
        roles:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/UserRoleObject'
          readOnly: true
          description: Roles in the organization.
        is_support:
          type: boolean
          readOnly: true
          title: Support
          description: Designates whether this user should be treated as a support.
      required:
      - email
      - has_mfa_device
      - id
      - is_support
      - roles
    PaginatedOrganizationUserList:
      type: object
      required:
      - results
      properties:
        meta:
          type: object
          properties:
            count:
              type: integer
            next:
              type:
              - string
              - 'null'
              format: uri
            previous:
              type:
              - string
              - 'null'
              format: uri
          required:
          - count
        results:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationUser'
    PatchedOrganization:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 254
        expire_uploads_period_days:
          type:
          - integer
          - 'null'
          readOnly: true
        archive_period_days:
          type:
          - integer
          - 'null'
          readOnly: true
        archive_restore_period_days:
          type:
          - integer
          - 'null'
          readOnly: true
        roles:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/UserRoleObject'
          readOnly: true
          description: Roles in the organization.
        uploads_enabled:
          type: boolean
          readOnly: true
          description: Designates whether the organization can access upload functionality.
        delete_samples_enabled:
          type: boolean
          readOnly: true
          description: Designates whether the organization can delete samples.
        project_sharing_enabled:
          type: boolean
          readOnly: true
          description: When enabled, allows organization to share projects with other organizations.
        account_on_hold:
          type: boolean
          readOnly: true
          description: When enabled, limits ability of organization to manage data and displays UI warning to organization users that invoice is past due.
        organization_type:
          allOf:
          - $ref: '#/components/schemas/OrganizationTypeEnum'
          readOnly: true
          description: 'Type of organization


            * `enterprise` - enterprise

            * `consumer` - consumer

            * `consumer_provider` - consumer provider'
    OrganizationTypeEnum:
      enum:
      - enterprise
      - consumer
      - consumer_provider
      type: string
      description: '* `enterprise` - enterprise

        * `consumer` - consumer

        * `consumer_provider` - consumer provider'
    UserRoleObjectCreate:
      type: object
      properties:
        user:
          type: string
          format: uuid
        role:
          type: string
          maxLength: 255
      required:
      - role
      - user
    UserRoleObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
      required:
      - id
      - name
  securitySchemes:
    API_key:
      type: apiKey
      description: 'Authorization header content formated as: `Api-Key <API-key>`

        You can obtain new API key through Gencove''s web UI or `user-api-key` endpoint'
      in: header
      name: Authorization
    JWT:
      type: apiKey
      description: 'Authorization header content formated as: `Bearer <json-web-token>`

        You can obtain access token using `jwt-create` endpoint.'
      in: header
      name: Authorization
