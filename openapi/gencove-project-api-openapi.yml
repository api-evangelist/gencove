          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectShareRevoke'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectShareRevoke'
        required: true
      security:
      - JWT: []
      - API key: []
      responses:
        '201':
          content:
            application/json:
