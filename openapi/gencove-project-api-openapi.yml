components:
  schemas:
    PaginatedQualityControlTypeList:
      type: object
      required:
      - results
      properties:
        meta:
          type: object
          properties:
            count:
              type: integer
            next:
              type:
              - string
              - 'null'
              format: uri
            previous:
              type:
              - string
              - 'null'
              format: uri
          required:
          - count
        results:
          type: array
          items:
            $ref: '#/components/schemas/QualityControlType'
    ProjectSubscription:
      type: object
      description: Subscription serializer where the scope is a project.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: User identifiable name, if left empty default name with a timestamp is used
          maxLength: 255
        project:
          type: string
          format: uuid
          readOnly: true
        target:
          type: string
          description: URL if webhook, e-mail address if email
          maxLength: 255
        protocol:
          allOf:
          - $ref: '#/components/schemas/ProtocolEnum'
          description: 'How is the notification delivered


            * `webhook` - webhook

            * `email` - email'
          readOnly: true
        event_types:
          type: array
          items: {}
          readOnly: true
          description: event types which will be delivered for current subscription
        has_secret:
          type: boolean
          description: Is webhook secret set
      required:
      - event_types
      - has_secret
      - id
      - project
      - protocol
      - target
    PaginatedProjectSubscriptionNotificationList:
      type: object
      required:
      - results
      properties:
        meta:
          type: object
          properties:
            count:
              type: integer
            next:
              type:
              - string
              - 'null'
              format: uri
            previous:
              type:
              - string
              - 'null'
              format: uri
          required:
          - count
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSubscriptionNotification'
    SampleList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        run:
          type:
          - string
          - 'null'
          format: uuid
        created:
          type: string
          format: date-time
        hidden:
          type: boolean
          description: Flag to hide the sample.
        modified:
          type: string
          format: date-time
        client_id:
          type: string
          description: 'Legacy: external_id'
          maxLength: 250
        physical_id:
          type: string
          description: 'Legacy: external_id, external_barcode and sample_barcode'
          maxLength: 250
        legacy_id:
          type: string
          description: 'Legacy: sample_id/member_id. Matching sample_ids from back_api app.'
          maxLength: 250
        last_status:
          allOf:
          - $ref: '#/components/schemas/SampleStatusNested'
          readOnly: true
        archive_last_status:
          allOf:
          - $ref: '#/components/schemas/ArchiveSampleStatus'
          readOnly: true
        failed_qc:
          type: string
          readOnly: true
          description: Description of failed_qc status if present
      required:
      - archive_last_status
      - client_id
      - failed_qc
      - id
      - last_status
      - legacy_id
      - modified
      - physical_id
    ProjectFileNested:
      type: object
      description: Used for all nested files except for files associated with sample.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        s3_path:
          type: string
          description: S3 object key
          maxLength: 1024
        size:
          type:
          - integer
          - 'null'
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Size as reported by AWS in bytes
        download_url:
          type: string
          format: uri
          readOnly: true
          description: Download url
        file_type:
          type: string
          description: File extension
          readOnly: true
        checksum_sha256:
          type: string
          description: Object's sha256 Checksum
          maxLength: 64
        shadow_mode:
          type:
          - boolean
          - 'null'
          description: If true, file is only accessible by organizations with shadow mode access enabled.
      required:
      - download_url
      - file_type
      - id
    OrganizationUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect this instead of deleting accounts.
        has_mfa_device:
          type: boolean
          readOnly: true
        name:
          type: string
          maxLength: 254
        roles:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/UserRoleObject'
          readOnly: true
          description: Roles in the organization.
        is_support:
          type: boolean
          readOnly: true
          title: Support
          description: Designates whether this user should be treated as a support.
      required:
      - email
      - has_mfa_device
      - id
      - is_support
      - roles
    ExtendedSampleSheetCreate:
      type: object
      description: 'Adds samples with their uploads to the project and attaches same

        metadata to all of them.'
      properties:
        uploads:
          type: array
          items:
            $ref: '#/components/schemas/SampleSheetCreate'
        metadata: {}
      required:
      - uploads
    SubscriptionSecret:
      type: object
      description: 'Serialize secret of a subscription.


        Used only for returning the secret, not reading it because the secret is

        safely encypted in the db.'
      properties:
        secret:
          type: string
          maxLength: 32
      required:
      - secret
    ProjectCancelSamples:
      type: object
      description: Serializer for canceling samples submitted to a project.
      properties:
        sample_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 20
      required:
      - sample_ids
    ProtocolEnum:
      enum:
      - webhook
      - email
      type: string
      description: '* `webhook` - webhook

        * `email` - email'
    SampleManifestUpload:
      type: object
      properties:
        sample_manifest:
          type: string
          format: uri
          writeOnly: true
      required:
      - sample_manifest
    ProjectHideUnhide:
      type: object
      description: Serializer for hiding or unhiding a list of projects
      properties:
        project_ids:
          type: array
          items:
            type: string
            format: uuid
          description: List of project IDs
      required:
      - project_ids
    BatchCreate:
      type: object
      properties:
        name:
          type: string
        batch_type:
          type: string
        sample_ids:
          type: array
          items:
            type: string
            format: uuid
          description: List of sample IDs or if empty all available samples will be used
      required:
      - batch_type
      - name
      - sample_ids
    ProjectUsers:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Email address
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect this instead of deleting accounts.
        name:
          type: string
          maxLength: 254
        roles:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/UserRoleObject'
          readOnly: true
          description: Roles for the project in the organization.
        is_support:
          type: boolean
          readOnly: true
          title: Support
          description: Designates whether this user should be treated as a support.
      required:
      - email
      - id
      - is_support
      - roles
    QualityControlType:
      type: object
      properties:
        key:
          type: string
          maxLength: 254
        type:
          type: string
        name:
          type: string
          readOnly: true
        description_markdown:
          type: string
          readOnly: true
        display_type:
          type: string
          readOnly: true
        display_only_if_failed:
          type: string
          readOnly: true
      required:
      - description_markdown
      - display_only_if_failed
      - display_type
      - key
      - name
      - type
    ProjectSamplesImport:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        samples:
          type: array
          items:
            $ref: '#/components/schemas/ExistingSample'
        metadata: {}
      required:
      - project_id
      - samples
    PaginatedEventTypeList:
      type: object
      required:
      - results
      properties:
        meta:
          type: object
          properties:
            count:
              type: integer
            next:
              type:
              - string
              - 'null'
              format: uri
            previous:
              type:
              - string
              - 'null'
              format: uri
          required:
          - count
        results:
          type: array
          items:
            $ref: '#/components/schemas/EventType'
    EventType:
      type: object
      description: Serializing event types using EventType choices options.
      properties:
        key:
          type: string
        description:
          type: string
      required:
      - description
      - key
    BatchDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 254
        batch_type:
          type: string
          description: Key from pipeline config
          readOnly: true
