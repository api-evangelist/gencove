      summary: Project shares list
      x-summary-source: derived
    post:
      operationId: project_shares_create
      tags:
      - Project
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectShare'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProjectShare'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectShare'
        required: true
      security:
      - JWT: []
      - API key: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectShare'
          description: ''
      summary: Project shares create
      x-summary-source: derived
  /api/v2/project-shares/{project_share_id}:
    get:
      operationId: project_shares_retrieve
      parameters:
      - in: path
        name: project_share_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Project
      security:
      - JWT: []
      - API key: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectShare'
          description: ''
      summary: Project shares retrieve
      x-summary-source: derived
  /api/v2/project-stats/{project_id}:
    get:
      operationId: project_stats_retrieve
      description: Retrieve user project and it's sample stats.
      parameters:
      - in: query
        name: archive_status
        schema:
          type: string
          enum:
          - all
          - archived
          - available
          - restore_requested
        description: Filter stats by samples and their archived status
      - in: query
        name: created_after
        schema:
          type: string
        description: Filter samples by created timestamp; use ISO8601 format
      - in: query
        name: created_before
        schema:
          type: string
        description: Filter samples by created timestamp; use ISO8601 format
      - in: query
        name: hidden_status
        schema:
          type: string
          enum:
          - all
          - hidden
