  meaning: The requested project, sample, or object does not exist or is not visible.
  remediation: Verify the resource id and that it belongs to your organization.
- status: 429
  title: Too Many Requests
  meaning: Client is sending requests faster than allowed (framework throttling).
  remediation: Back off and retry; batch operations where possible.
- status: 500
